spring.application.name=demo

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver


# --- Crucial JPA / Hibernate Settings (Add these) ---
# Instructs Hibernate to sync database schemas with your @Entity objects
# Options: 'update' (dev/testing), 'validate' (production), or 'none'
spring.jpa.hibernate.ddl-auto=update

# Explicitly maps Hibernate sql dialect to PostgreSQL features
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Optional: Prints generated SQL to your console (highly useful for debugging queries)
spring.jpa.show-sql=true
spring.data.redis.host=localhost
spring.data.redis.port=6379